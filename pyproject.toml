[project]
name = "chessbot"
version = "0.1.0"
description = "AlphaZero-style chess engine: supervised pretraining, MCTS and self-play RL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "chess>=1.10",
    "pyyaml>=6.0",
    "zstandard>=0.22",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-tqdm",
]

[project.scripts]
train = "chessbot.cli:train"
selfplay = "chessbot.cli:selfplay"
play = "chessbot.cli:play"
evaluate = "chessbot.cli:evaluate"
smoke = "chessbot.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/dashboard.py" = ["E501"]
